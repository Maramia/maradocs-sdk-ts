# Publish to npm on version tags (v1.4.0, …).
# Requires an npm Trusted Publisher:
#   package: @maramia/maradocs-sdk-ts
#   owner/repo: Maramia/maradocs-sdk-ts
#   workflow: publish.yml
#   environment: npm
name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@maramia/maradocs-sdk-ts
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: npm ci
      - run: npm run build --if-present
      - run: npm publish
